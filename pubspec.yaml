name: smart_budget
description: A Flutter-based smart budgeting app with offline Drift DB and Supabase sync.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  image_picker: ^1.0.7
  uuid: ^4.0.0
  path: ^1.8.0
  collection: ^1.18.0

  flutter_localizations:
    sdk: flutter

  # 🔐 Supabase
  supabase_flutter: ^2.5.0
  flutter_dotenv: ^6.0.0

  # 💾 Drift (LOCAL DATABASE)
  drift: ^2.29.0
  drift_flutter: ^0.2.7  # 🔥 versi yang benar
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.2
  crypto: ^3.0.3

  connectivity_plus: ^7.0.0
  shared_preferences: ^2.2.2

  pie_chart: ^5.4.0
  intl: ^0.20.2

  go_router: ^16.2.4
  async: ^2.13.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  # 🛠 Drift code generator
  drift_dev: ^2.29.0      # 🔥 harus sama major dengan drift
  build_runner: ^2.4.10

  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter_native_splash:
  background_image: assets/images/splash.png
  fullscreen: true
  android_12:
    background_image: assets/images/splash.png
    fullscreen: true
